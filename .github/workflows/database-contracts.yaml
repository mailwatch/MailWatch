name: Database contracts

on:
  push:
    branches: [ "1.3" ]
  pull_request:
    branches: [ "1.3" ]
  workflow_dispatch:

jobs:
  contract-tests:
    name: "${{ matrix.engine }} | PHP 8.3"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: mysql
            image: mysql:5.7
          - engine: mariadb
            image: mariadb:10.4

    services:
      database:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: mailwatch_contract
          MYSQL_USER: mailwatch
          MYSQL_PASSWORD: mailwatch
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      MAILWATCH_CONTRACT_DSN: "${{ matrix.engine }}://mailwatch:mailwatch@127.0.0.1:3306/mailwatch_contract"

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, pdo_sqlite
          coverage: none

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v4

      - name: Run database contract tests
        run: ./vendor/bin/phpunit tests/Contract
