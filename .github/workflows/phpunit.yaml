name: PHPUnit

on:
  push:
    branches: [ "1.2" ]
    paths-ignore:
      - '**/*.md'
      - 'data/**'
      - 'MailScanner_perl_scripts/**'
      - 'tools/MailScanner_config/**'
      - 'tools/sudo/**'
  pull_request:
    branches: [ "1.2" ]
    paths-ignore:
      - '**/*.md'
      - 'data/**'
      - 'MailScanner_perl_scripts/**'
      - 'tools/MailScanner_config/**'
      - 'tools/sudo/**'
  workflow_dispatch:

jobs:
  test:
    name: "PHP: ${{ matrix.php-version }} | PHPUnit"
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}

    strategy:
      fail-fast: false
      matrix:
        php-version: ['7.4', '8.5']
        experimental: [false]
        include:
          # not released yet: report, do not block
          - php-version: '8.6'
            experimental: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mysqli
          coverage: none

      - name: Install Composer dependencies
        uses: "ramsey/composer-install@v4"
        with:
          # composer.json lists released PHP versions only
          composer-options: ${{ matrix.experimental && '--ignore-platform-req=php' || '' }}

      - name: Run tests
        run: ./vendor/bin/phpunit
