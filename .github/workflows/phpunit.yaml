name: PHPUnit

on:
  push:
    branches: [ "1.3" ]
    paths-ignore:
      - '**/*.md'
      - 'data/**'
      - 'MailScanner_perl_scripts/**'
      - 'tools/MailScanner_config/**'
      - 'tools/sudo/**'
  pull_request:
    branches: [ "1.3" ]
    paths-ignore:
      - '**/*.md'
      - 'data/**'
      - 'MailScanner_perl_scripts/**'
      - 'tools/MailScanner_config/**'
      - 'tools/sudo/**'
  workflow_dispatch:

jobs:
  test:
    name: "PHP: ${{ matrix.php-version }} | PHPUnit"
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}

    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.5']
        experimental: [false]
        include:
          # PHP 8.6 nightly: reports regressions early without failing the run
          - php-version: '8.6'
            experimental: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mysqli, pdo_mysql, pdo_sqlite
          coverage: none

      - name: Install Composer dependencies
        uses: "ramsey/composer-install@v4"

      - name: Run tests
        run: ./vendor/bin/phpunit
